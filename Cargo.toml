[package]
name = "bdtv-hub"
version = "0.1.0"
edition = "2024"
authors = ["peter2500zz <peter2500zz@qq.com>"]
license = "Apache-2.0"
repository = "https://github.com/bdtv-lab/bdtv-hub"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
azalea-chat = "0.16.0"
dotenvy = "0.15.7"
kyori-component-json = "0.2.1"
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smaragdine = { git = "https://github.com/peter2500zz/smaragdine.git", version = "0.1.5", branch = "feature/async-console", features = ["async"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["serde", "v4"] }
