[package]
name = "smc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
reqwest = "0.13.4"
smaragdine = { git = "https://github.com/peter2500zz/smaragdine.git", version = "0.1.5" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.1", features = ["v4"] }
