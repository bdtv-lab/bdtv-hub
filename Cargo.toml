[package]
name = "servers-management-center"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = "0.30.0"
